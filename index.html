<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUCCA CRM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #b8975a;
    --gold-light: #d4b483;
    --gold-dim: #b8975a33;
    --bg: #0c0c0e;
    --bg2: #131318;
    --bg3: #1a1a22;
    --border: #2a2a38;
    --text: #e8e6e0;
    --text-dim: #888890;
    --green: #4caf7d;
    --red: #e05c5c;
    --blue: #5c8fe0;
  }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; min-height: 100vh; }
  #root { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
  .sidebar-logo { padding: 28px 20px 20px; border-bottom: 1px solid var(--border); }
  .sidebar-logo h1 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; color: var(--gold); letter-spacing: 3px; }
  .sidebar-logo span { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }
  .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav-section { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; padding: 12px 8px 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-dim); transition: all 0.15s; font-size: 13.5px; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--gold-dim); color: var(--gold); }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); }
  .main { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg); position: sticky; top: 0; z-index: 50; }
  .topbar-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; color: var(--text); }
  .topbar-actions { display: flex; gap: 10px; align-items: center; }
  .content { padding: 28px 32px; flex: 1; }
  .btn { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; transition: all 0.15s; }
  .btn-gold { background: var(--gold); color: #0c0c0e; }
  .btn-gold:hover { background: var(--gold-light); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-danger { background: var(--red); color: #fff; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card-title { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--gold); margin-bottom: 16px; letter-spacing: 0.5px; }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
  .stat-value { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 500; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.gold { color: var(--gold); }
  .stat-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 500; }
  td { padding: 12px 14px; border-bottom: 1px solid var(--border)22; font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg3); }
  .clickable-row { cursor: pointer; }
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .badge-green { background: #4caf7d22; color: var(--green); }
  .badge-red { background: #e05c5c22; color: var(--red); }
  .badge-gold { background: var(--gold-dim); color: var(--gold); }
  .badge-blue { background: #5c8fe022; color: var(--blue); }
  .badge-gray { background: #ffffff11; color: var(--text-dim); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  input, select, textarea { background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; transition: border 0.15s; width: 100%; }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: var(--bg3); }
  .modal-overlay { position: fixed; inset: 0; background: #00000088; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 24px 24px 0; display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--gold); }
  .modal-body { padding: 20px 24px 24px; }
  .modal-footer { padding: 0 24px 24px; display: flex; gap: 10px; justify-content: flex-end; }
  .close-btn { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }
  .close-btn:hover { color: var(--text); }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .tab { padding: 10px 20px; cursor: pointer; color: var(--text-dim); font-size: 13px; border-bottom: 2px solid transparent; transition: all 0.15s; margin-bottom: -1px; }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab:hover { color: var(--text); }
  .search-bar { position: relative; }
  .search-bar input { padding-left: 36px; min-width: 240px; }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 14px; }
  .profit-bar { height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden; margin-top: 6px; }
  .profit-fill { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.5s; }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .detail-item label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; }
  .detail-item .val { font-size: 14px; color: var(--text); }
  .filter-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tag-pill { display: inline-flex; align-items: center; gap: 4px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 11px; color: var(--text-dim); }
  .tag-pill.vip { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .section-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--text); }
  .amount-pos { color: var(--green); font-weight: 500; }
  .amount-neg { color: var(--red); font-weight: 500; }
  .scrollable { max-height: 400px; overflow-y: auto; }
  .bar-chart { display: flex; gap: 8px; align-items: flex-end; height: 120px; padding: 0 4px; overflow: hidden; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; min-width: 0; }
  .bar-wrap { flex: 1; display: flex; align-items: flex-end; width: 100%; overflow: hidden; gap: 2px; }
  .bar { min-width: 0; flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; max-height: 100%; transition: height 0.5s; }
  .bar-label { font-size: 10px; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 6px; }
  .sync-dot.syncing { background: var(--gold); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ─── CONFIG ──────────────────────────────────────────────────────────────
// ↓↓↓ Вставь сюда URL из Google Apps Script после деплоя ↓↓↓
const API_URL = 'https://script.google.com/macros/s/AKfycbwA1a4I7Dd2x1ZY3hlfrXiyiVWP9yQHw13It8nMWDlMSUzajAhMEP68JxzrzI_z4S1L/exec';

// ─── HELPERS ─────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2, 9);
const fmt = (n) => new Intl.NumberFormat('ru-RU').format(Math.round(n || 0));
const today = () => new Date().toISOString().split('T')[0];
const MONTHS = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const monthKey = (d) => d ? d.slice(0,7) : '';
const API_READY = API_URL !== 'YOUR_SCRIPT_URL_HERE';

// ─── API ─────────────────────────────────────────────────────────────────
const apiLoad = (sheet) =>
  fetch(`${API_URL}?sheet=${sheet}&t=${Date.now()}`)
    .then(r => r.json())
    .catch(() => []);

const apiAdd = (sheet, data) => {
  if (!API_READY) return;
  fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'add', sheet, data }) }).catch(() => {});
};

const apiDel = (sheet, id) => {
  if (!API_READY) return;
  fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'delete', sheet, id }) }).catch(() => {});
};

const EXPENSE_CATS = ['Реклама', 'Закупка букетов', 'Зарплата', 'Прочее', 'Инструменты', 'Транспорт'];

// ─── MODAL ───────────────────────────────────────────────────────────────
function Modal({ title, onClose, children, footer }) {
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <span className="modal-title">{title}</span>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────
function Dashboard({ orders, expenses, clients }) {
  const revenue = orders.filter(o=>o.status==='выполнен').reduce((s,o)=>s+o.sellPrice,0);
  const cogs = orders.filter(o=>o.status==='выполнен').reduce((s,o)=>s+o.buyPrice,0);
  const expTotal = expenses.reduce((s,e)=>s+e.amount,0);
  const profit = revenue - cogs - expTotal;
  const margin = revenue ? ((profit/revenue)*100).toFixed(1) : 0;
  const months = {};
  orders.filter(o=>o.status==='выполнен').forEach(o => {
    const m = monthKey(o.date);
    if(!months[m]) months[m] = { rev: 0, cost: 0 };
    months[m].rev += o.sellPrice; months[m].cost += o.buyPrice;
  });
  expenses.forEach(e => {
    const m = monthKey(e.date);
    if(!months[m]) months[m] = { rev: 0, cost: 0 };
    months[m].cost += e.amount;
  });
  const chartData = Object.entries(months).sort().slice(-6).map(([k,v])=>({ label: MONTHS[parseInt(k.split('-')[1])-1], rev: v.rev, cost: v.cost }));
  const maxVal = Math.max(...chartData.map(d=>d.rev), 1);
  const expByCat = {};
  expenses.forEach(e => { expByCat[e.category] = (expByCat[e.category]||0)+e.amount; });
  const recentOrders = [...orders].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  return (
    <div>
      <div className="stats-grid">
        <div className="stat-card"><div className="stat-label">Выручка</div><div className="stat-value gold">{fmt(revenue)} $</div><div className="stat-sub">{orders.filter(o=>o.status==='выполнен').length} выполненных заказов</div></div>
        <div className="stat-card"><div className="stat-label">Расходы</div><div className="stat-value red">{fmt(cogs+expTotal)} $</div><div className="stat-sub">Закупки + операционные</div></div>
        <div className="stat-card"><div className="stat-label">Прибыль</div><div className={`stat-value ${profit>=0?'green':'red'}`}>{fmt(profit)} $</div><div className="profit-bar"><div className="profit-fill" style={{width:Math.max(0,Math.min(100,margin))+'%'}}></div></div><div className="stat-sub">Маржа {margin}%</div></div>
        <div className="stat-card"><div className="stat-label">Клиентов</div><div className="stat-value gold">{clients.length}</div><div className="stat-sub">{clients.filter(c=>c.vip).length} VIP клиентов</div></div>
      </div>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:16}}>
        <div className="card">
          <div className="card-title">Доходы vs Расходы (по месяцам)</div>
          {chartData.length === 0 ? <div className="empty"><div className="empty-icon">📊</div><p>Нет данных</p></div> :
          <div className="bar-chart">{chartData.map(d => (<div key={d.label} className="bar-col"><div className="bar-wrap" style={{gap:3}}><div className="bar" style={{background:'var(--green)', height:(d.rev/maxVal*100)+'%'}}></div><div className="bar" style={{background:'var(--red)', height:(d.cost/maxVal*100)+'%'}}></div></div><div className="bar-label">{d.label}</div></div>))}</div>}
          <div style={{display:'flex',gap:16,marginTop:12,fontSize:11,color:'var(--text-dim)'}}><span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:8,height:8,background:'var(--green)',borderRadius:2,display:'inline-block'}}></span>Доход</span><span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:8,height:8,background:'var(--red)',borderRadius:2,display:'inline-block'}}></span>Расходы</span></div>
        </div>
        <div className="card">
          <div className="card-title">Расходы по категориям</div>
          {Object.entries(expByCat).length === 0 ? <div className="empty"><div className="empty-icon">💰</div><p>Нет расходов</p></div> :
          Object.entries(expByCat).sort((a,b)=>b[1]-a[1]).map(([cat, amt])=>(<div key={cat} style={{marginBottom:12}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}><span>{cat}</span><span className="amount-neg">{fmt(amt)} $</span></div><div className="profit-bar"><div style={{height:'100%',borderRadius:3,background:'var(--gold)',width:(amt/expTotal*100)+'%',transition:'width 0.5s'}}></div></div></div>))}
        </div>
      </div>
      <div className="card">
        <div className="card-title">Последние заказы</div>
        {recentOrders.length === 0 ? <div className="empty"><div className="empty-icon">📦</div><p>Нет заказов</p></div> :
        <div className="table-wrap"><table><thead><tr><th>Дата</th><th>Клиент</th><th>Товар</th><th>Город</th><th>Продажа</th><th>Закупка</th><th>Прибыль</th><th>Статус</th></tr></thead><tbody>{recentOrders.map(o=>(<tr key={o.id}><td>{o.date}</td><td>{o.clientName}</td><td style={{color:'var(--text-dim)'}}>{o.item}</td><td>{o.city}</td><td className="amount-pos">{fmt(o.sellPrice)} $</td><td className="amount-neg">{fmt(o.buyPrice)} $</td><td className={o.sellPrice-o.buyPrice>=0?'amount-pos':'amount-neg'}>{fmt(o.sellPrice-o.buyPrice)} $</td><td><StatusBadge status={o.status}/></td></tr>))}</tbody></table></div>}
      </div>
    </div>
  );
}

function StatusBadge({status}) {
  const map = { 'выполнен':'badge-green','в процессе':'badge-blue','отменён':'badge-red','новый':'badge-gold' };
  return <span className={`badge ${map[status]||'badge-gray'}`}>{status}</span>;
}

// ─── ORDERS ──────────────────────────────────────────────────────────────
function Orders({ orders, setOrders, clients }) {
  const [showModal, setShowModal] = useState(false);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [filterCity, setFilterCity] = useState('');
  const [form, setForm] = useState({ clientId:'', clientName:'', city:'', item:'', supplier:'', sellPrice:'', buyPrice:'', currency:'USD', status:'новый', manager:'', date:today(), notes:'' });
  const cities = [...new Set(orders.map(o=>o.city).filter(Boolean))];
  const filtered = orders.filter(o =>
    (!search || o.clientName.toLowerCase().includes(search.toLowerCase()) || o.item.toLowerCase().includes(search.toLowerCase())) &&
    (!filterStatus || o.status === filterStatus) &&
    (!filterCity || o.city === filterCity)
  ).sort((a,b)=>b.date.localeCompare(a.date));
  const save = () => {
    if(!form.item || !form.sellPrice) return;
    const client = clients.find(c=>c.id===form.clientId);
    const newItem = { ...form, id: uid(), sellPrice: +form.sellPrice, buyPrice: +form.buyPrice, clientName: client ? client.name : form.clientName, city: client ? client.city : form.city };
    setOrders(prev => [...prev, newItem]);
    apiAdd('orders', newItem);
    setShowModal(false);
    setForm({ clientId:'', clientName:'', city:'', item:'', supplier:'', sellPrice:'', buyPrice:'', currency:'USD', status:'новый', manager:'', date:today(), notes:'' });
  };
  const del = (id) => { setOrders(prev => prev.filter(o => o.id !== id)); apiDel('orders', id); };
  return (
    <div>
      <div className="section-header"><h2>Заказы</h2><button className="btn btn-gold" onClick={()=>setShowModal(true)}>+ Новый заказ</button></div>
      <div className="filter-row" style={{marginBottom:16}}>
        <div className="search-bar"><span className="search-icon">🔍</span><input placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{width:'auto'}}><option value="">Все статусы</option>{['новый','в процессе','выполнен','отменён'].map(s=><option key={s}>{s}</option>)}</select>
        <select value={filterCity} onChange={e=>setFilterCity(e.target.value)} style={{width:'auto'}}><option value="">Все города</option>{cities.map(c=><option key={c}>{c}</option>)}</select>
      </div>
      <div className="card">
        {filtered.length === 0 ? <div className="empty"><div className="empty-icon">📦</div><p>Заказов не найдено</p></div> :
        <div className="table-wrap"><table><thead><tr><th>Дата</th><th>Клиент</th><th>Товар</th><th>Поставщик</th><th>Город</th><th>Продажа</th><th>Закупка</th><th>Маржа</th><th>Менеджер</th><th>Статус</th><th></th></tr></thead><tbody>{filtered.map(o=>(<tr key={o.id}><td>{o.date}</td><td>{o.clientName}</td><td style={{color:'var(--text-dim)'}}>{o.item}</td><td style={{color:'var(--text-dim)'}}>{o.supplier}</td><td>{o.city}</td><td className="amount-pos">{fmt(o.sellPrice)} $</td><td className="amount-neg">{fmt(o.buyPrice)} $</td><td className={o.sellPrice-o.buyPrice>=0?'amount-pos':'amount-neg'}>{fmt(o.sellPrice-o.buyPrice)} $</td><td>{o.manager}</td><td><StatusBadge status={o.status}/></td><td><button className="btn btn-ghost btn-sm" onClick={()=>del(o.id)}>✕</button></td></tr>))}</tbody></table></div>}
      </div>
      {showModal && (
        <Modal title="Новый заказ" onClose={()=>setShowModal(false)} footer={<><button className="btn btn-ghost" onClick={()=>setShowModal(false)}>Отмена</button><button className="btn btn-gold" onClick={save}>Сохранить</button></>}>
          <div className="form-grid">
            <div className="form-group"><label>Клиент</label><select value={form.clientId} onChange={e=>{ const c=clients.find(x=>x.id===e.target.value); setForm(f=>({...f,clientId:e.target.value,clientName:c?c.name:'',city:c?c.city:''})); }}><option value="">— выбрать —</option>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
            <div className="form-group"><label>Дата</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
            <div className="form-group full"><label>Состав / Название букета</label><input placeholder="Розы 51шт, красные" value={form.item} onChange={e=>setForm(f=>({...f,item:e.target.value}))}/></div>

// ─── P&L ─────────────────────────────────────────────────────────────────
function PnL({ orders, expenses }) {
  const [period, setPeriod] = useState('all');
  const [specificMonth, setSpecificMonth] = useState('');
  const allMonths = useMemo(() => { const keys = new Set(); [...orders, ...expenses].forEach(x => { if(x.date) keys.add(x.date.slice(0,7)); }); return [...keys].sort().reverse(); }, [orders, expenses]);
  const filterByPeriod = (items, dateField) => {
    const now = new Date();
    return items.filter(item => {
      if(period==='specific') return item[dateField] && item[dateField].startsWith(specificMonth);
      if(period==='all') return true;
      const d = new Date(item[dateField]);
      if(period==='month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
      if(period==='quarter') { const q = Math.floor(now.getMonth()/3); return Math.floor(d.getMonth()/3)===q && d.getFullYear()===now.getFullYear(); }
      return d.getFullYear()===now.getFullYear();
    });
  };
  const filtOrders = filterByPeriod(orders.filter(o=>o.status==='выполнен'),'date');
  const filtExp = filterByPeriod(expenses,'date');
  const revenue = filtOrders.reduce((s,o)=>s+o.sellPrice,0);
  const cogs = filtOrders.reduce((s,o)=>s+o.buyPrice,0);
  const grossProfit = revenue - cogs;
  const opEx = filtExp.reduce((s,e)=>s+e.amount,0);
  const netProfit = grossProfit - opEx;
  const margin = revenue ? ((netProfit/revenue)*100).toFixed(1) : 0;
  const byCity = {}; filtOrders.forEach(o=>{ if(!byCity[o.city]) byCity[o.city]={rev:0,cost:0}; byCity[o.city].rev+=o.sellPrice; byCity[o.city].cost+=o.buyPrice; });
  const byMgr = {}; filtOrders.forEach(o=>{ if(!byMgr[o.manager||'—']) byMgr[o.manager||'—']=0; byMgr[o.manager||'—']+=o.sellPrice; });
  const Row = ({label, value, sub, bold, color}) => (<div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--border)',fontWeight:bold?'600':'400'}}><span style={{color:sub?'var(--text-dim)':undefined,paddingLeft:sub?16:0}}>{label}</span><span style={{color:color||undefined}}>{fmt(value)} $</span></div>);
  return (
    <div>
      <div className="section-header">
        <h2>Отчёт P&L</h2>
        <div style={{display:'flex',gap:8}}>
          {[['all','Всё время'],['month','Тек. месяц'],['quarter','Квартал'],['year','Год']].map(([v,l])=>(<button key={v} className={`btn ${period===v?'btn-gold':'btn-ghost'} btn-sm`} onClick={()=>{ setPeriod(v); setSpecificMonth(''); }}>{l}</button>))}
          <select value={period==='specific'?specificMonth:''} onChange={e=>{ if(e.target.value){ setSpecificMonth(e.target.value); setPeriod('specific'); } }} style={{height:32,fontSize:12,padding:'0 8px',borderRadius:8,border:'1px solid '+(period==='specific'?'var(--gold)':'var(--border)'),background:'var(--bg3)',color:period==='specific'?'var(--gold)':'var(--text-dim)',cursor:'pointer',outline:'none'}}>
            <option value="">Месяц...</option>
            {allMonths.map(m=>{ const [y,mo]=m.split('-'); return <option key={m} value={m}>{['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'][parseInt(mo)-1]} {y}</option>; })}
          </select>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div className="card">
          <div className="card-title">Отчёт о прибылях и убытках</div>
          <Row label="Выручка" value={revenue} bold color="var(--green)"/>
          <Row label="Закупка букетов" value={cogs} sub color="var(--red)"/>
          <Row label="Валовая прибыль" value={grossProfit} bold color={grossProfit>=0?'var(--green)':'var(--red)'}/>
          <div style={{height:8}}/>
          <div style={{fontSize:11,color:'var(--text-dim)',textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Операционные расходы</div>
          {EXPENSE_CATS.map(cat=>{ const amt=filtExp.filter(e=>e.category===cat).reduce((s,e)=>s+e.amount,0); return amt>0?<Row key={cat} label={cat} value={amt} sub color="var(--red)"/>:null; })}
          <Row label="Итого расходы" value={opEx} bold color="var(--red)"/>
          <div style={{height:8}}/>
          <Row label="Чистая прибыль" value={netProfit} bold color={netProfit>=0?'var(--green)':'var(--red)'}/>
          <div style={{marginTop:12,padding:'12px',background:'var(--bg3)',borderRadius:8,textAlign:'center'}}><div style={{fontSize:11,color:'var(--text-dim)',marginBottom:4}}>Маржинальность</div><div style={{fontFamily:'Cormorant Garamond',fontSize:32,color:netProfit>=0?'var(--green)':'var(--red)'}}>{margin}%</div></div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div className="card"><div className="card-title">По городам</div>{Object.entries(byCity).length===0?<div style={{color:'var(--text-dim)',fontSize:12}}>Нет данных</div>:Object.entries(byCity).sort((a,b)=>b[1].rev-a[1].rev).map(([city,d])=>(<div key={city} style={{marginBottom:12}}><div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}}><span>{city}</span><span className="amount-pos">{fmt(d.rev)} $</span></div><div className="profit-bar"><div className="profit-fill" style={{width:revenue?(d.rev/revenue*100)+'%':'0%'}}></div></div></div>))}</div>
          <div className="card"><div className="card-title">По менеджерам</div>{Object.entries(byMgr).length===0?<div style={{color:'var(--text-dim)',fontSize:12}}>Нет данных</div>:Object.entries(byMgr).sort((a,b)=>b[1]-a[1]).map(([mgr,rev])=>(<div key={mgr} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)22',fontSize:13}}><span>{mgr}</span><span className="amount-pos">{fmt(rev)} $</span></div>))}</div>
          <div className="card"><div className="card-title">Ключевые показатели</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>{[['Заказов',filtOrders.length,''],['Средний чек',filtOrders.length?Math.round(revenue/filtOrders.length):0,' $'],['Ср. маржа/заказ',filtOrders.length?Math.round(grossProfit/filtOrders.length):0,' $'],['ROI рекламы',filtExp.filter(e=>e.category==='Реклама').reduce((s,e)=>s+e.amount,0)?Math.round(revenue/filtExp.filter(e=>e.category==='Реклама').reduce((s,e)=>s+e.amount,0)*100):0,'%']].map(([l,v,suf])=>(<div key={l} style={{background:'var(--bg3)',borderRadius:8,padding:12}}><div style={{fontSize:10,color:'var(--text-dim)',textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>{l}</div><div style={{fontFamily:'Cormorant Garamond',fontSize:22,color:'var(--gold)'}}>{fmt(v)}{suf}</div></div>))}</div></div>
        </div>
      </div>
    </div>
  );
}

      <div className="main">
        <div className="topbar">
          <div className="topbar-title">{pageTitle}</div>
          <div className="topbar-actions"><span style={{fontSize:12,color:'var(--text-dim)'}}>🌸 {clients.length} клиентов · {orders.length} заказов</span></div>
        </div>
        <div className="content">
          {!API_READY && <div style={{background:'#b8975a22',border:'1px solid var(--gold)',borderRadius:10,padding:'14px 20px',marginBottom:24,fontSize:13,color:'var(--gold)'}}>⚠️ Google Sheets не подключён. Вставь URL из Apps Script в переменную <code>API_URL</code> в файле CRM.</div>}
          {page==='dashboard' && <Dashboard orders={orders} expenses={expenses} clients={clients}/>}
          {page==='orders' && <Orders orders={orders} setOrders={setOrders} clients={clients}/>}
          {page==='clients' && <Clients clients={clients} setClients={setClients} orders={orders}/>}
          {page==='expenses' && <Expenses expenses={expenses} setExpenses={setExpenses}/>}
          {page==='pnl' && <PnL orders={orders} expenses={expenses}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
