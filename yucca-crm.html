<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUCCA CRM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #2563eb;
    --accent-dim: #2563eb18;
    --bg: #09090b;
    --bg2: #111113;
    --bg3: #18181b;
    --border: #27272a;
    --text: #fafafa;
    --text-dim: #71717a;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --gold: #2563eb;
    --gold-light: #3b82f6;
    --gold-dim: #2563eb18;
  }
  .light {
    --accent: #2563eb;
    --accent-dim: #2563eb12;
    --bg: #f4f4f5;
    --bg2: #ffffff;
    --bg3: #f4f4f5;
    --border: #e4e4e7;
    --text: #09090b;
    --text-dim: #71717a;
    --green: #16a34a;
    --red: #dc2626;
    --blue: #2563eb;
    --amber: #d97706;
    --gold: #2563eb;
    --gold-light: #3b82f6;
    --gold-dim: #2563eb12;
  }
  body { background: var(--bg); color: var(--text); font-family: system-ui,-apple-system,'Segoe UI',sans-serif; font-size: 13px; min-height: 100vh; }
  #root { display: flex; min-height: 100vh; }

  /* SIDEBAR */
  .sidebar { width: 210px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
  .sidebar-logo { padding: 18px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .sidebar-logo h1 { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; text-transform: uppercase; }
  .sidebar-logo span { font-size: 10px; color: var(--text-dim); }
  .sidebar-nav { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 1px; }
  .nav-section { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; padding: 10px 8px 4px; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; cursor: pointer; color: var(--text-dim); transition: all 0.1s; font-size: 13px; font-weight: 400; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
  .nav-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
  .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); }

  /* MAIN */
  .main { margin-left: 210px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { padding: 0 24px; height: 48px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg2); position: sticky; top: 0; z-index: 50; }
  .topbar-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .content { padding: 20px 24px; flex: 1; }

  /* BUTTONS */
  .btn { padding: 7px 14px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500; transition: all 0.1s; line-height: 1.4; }
  .btn-gold { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-gold:hover { background: #1d4ed8; }
  .btn-ghost { background: transparent; color: var(--text-dim); border-color: var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: #52525b; background: var(--bg3); }
  .btn-sm { padding: 4px 10px; font-size: 11px; }
  .btn-danger { background: var(--red); color: #fff; border-color: var(--red); }

  /* CARDS */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 500; }
  .stat-value { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.gold { color: var(--text); }
  .stat-sub { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 500; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg3); }
  .clickable-row { cursor: pointer; }

  /* BADGE */
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .badge-green { background: #22c55e18; color: var(--green); }
  .badge-red { background: #ef444418; color: var(--red); }
  .badge-gold { background: var(--accent-dim); color: var(--accent); }
  .badge-blue { background: #3b82f618; color: var(--blue); }
  .badge-gray { background: var(--bg3); color: var(--text-dim); border: 1px solid var(--border); }

  /* FORM */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
  input, select, textarea { background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 10px; font-family: inherit; font-size: 13px; outline: none; transition: border 0.1s; width: 100%; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 72px; }
  select option { background: var(--bg3); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: #00000060; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 18px 20px 0; display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .modal-body { padding: 16px 20px 20px; }
  .modal-footer { padding: 0 20px 20px; display: flex; gap: 8px; justify-content: flex-end; }
  .close-btn { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 2px 6px; line-height: 1; border-radius: 4px; }
  .close-btn:hover { background: var(--bg3); color: var(--text); }

  /* MISC */
  .search-bar { position: relative; }
  .search-bar input { padding-left: 32px; min-width: 220px; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 13px; }
  .profit-bar { height: 4px; border-radius: 2px; background: var(--bg3); overflow: hidden; margin-top: 6px; }
  .profit-fill { height: 100%; border-radius: 2px; background: var(--green); transition: width 0.4s; }
  .empty { text-align: center; padding: 48px 20px; color: var(--text-dim); }
  .empty-icon { font-size: 32px; margin-bottom: 10px; }
  .empty p { font-size: 13px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .detail-item label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 3px; font-weight: 500; }
  .detail-item .val { font-size: 13px; color: var(--text); }
  .filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag-pill { display: inline-flex; align-items: center; gap: 4px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 11px; color: var(--text-dim); }
  .tag-pill.vip { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-header h2 { font-size: 15px; font-weight: 600; color: var(--text); }
  .amount-pos { color: var(--green); font-weight: 500; }
  .amount-neg { color: var(--red); font-weight: 500; }
  .scrollable { max-height: 360px; overflow-y: auto; }
  .bar-chart { display: flex; gap: 6px; align-items: flex-end; height: 100px; padding: 0 2px; overflow: hidden; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; min-width: 0; }
  .bar-wrap { flex: 1; display: flex; align-items: flex-end; width: 100%; overflow: hidden; gap: 2px; }
  .bar { min-width: 0; flex: 1; border-radius: 2px 2px 0 0; min-height: 2px; max-height: 100%; transition: height 0.4s; }
  .bar-label { font-size: 10px; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 5px; }
  .sync-dot.syncing { background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* CLIENT SEARCH */
  .client-search-wrap { position: relative; }
  .client-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; z-index: 300; max-height: 200px; overflow-y: auto; margin-top: 3px; box-shadow: 0 8px 20px #00000055; }
  .client-option { padding: 8px 10px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .client-option:last-child { border-bottom: none; }
  .client-option:hover { background: var(--bg3); }
  .client-option .opt-phone { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

  /* HAMBURGER */
  .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 4px 6px; color: var(--text-dim); font-size: 18px; line-height: 1; }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: #00000066; z-index: 99; }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab { padding: 8px 16px; cursor: pointer; color: var(--text-dim); font-size: 13px; border-bottom: 2px solid transparent; transition: all 0.1s; margin-bottom: -1px; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  .tab:hover { color: var(--text); }

  /* MOBILE */
  @media (max-width: 768px) {
    .hamburger { display: block; }
    .sidebar { transform: translateX(-100%); transition: transform 0.2s; z-index: 200; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.open { display: block; }
    .main { margin-left: 0; }
    .topbar { padding: 0 14px; }
    .content { padding: 14px; }
    .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-card { padding: 12px; }
    .stat-value { font-size: 20px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .detail-grid { grid-template-columns: 1fr; }
    .search-bar input { min-width: 0; width: 100%; }
    .section-header { flex-wrap: wrap; gap: 8px; }
    .modal { max-width: 100%; margin: 0; border-radius: 10px 10px 0 0; }
    .modal-overlay { align-items: flex-end; padding: 0; }
    table { font-size: 12px; }
    th, td { padding: 7px 9px; }
    html, body, #root, #app { overflow-x: hidden; max-width: 100vw; }
    .resp-grid { grid-template-columns: 1fr !important; }
    .hide-mob { display: none !important; }
  }
  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ─── CONFIG ──────────────────────────────────────────────────────────────
// ↓↓↓ Вставь сюда URL из Google Apps Script после деплоя ↓↓↓
const API_URL = 'https://script.google.com/macros/s/AKfycbwA1a4I7Dd2x1ZY3hlfrXiyiVWP9yQHw13It8nMWDlMSUzajAhMEP68JxzrzI_z4S1L/exec';

// ─── HELPERS ─────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2, 9);
const fmt = (n) => new Intl.NumberFormat('ru-RU').format(Math.round(n || 0));
const today = () => new Date().toISOString().split('T')[0];
const MONTHS = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const monthKey = (d) => d ? d.slice(0,7) : '';
const API_READY = API_URL !== 'YOUR_SCRIPT_URL_HERE';
const fmtDate = (d) => d ? String(d).split('T')[0] : '—';

// ─── API ─────────────────────────────────────────────────────────────────
const apiLoad = (sheet) =>
  fetch(`${API_URL}?sheet=${sheet}&t=${Date.now()}`)
    .then(r => r.json())
    .catch(() => []);

const apiAdd = (sheet, data) => {
  if (!API_READY) return Promise.resolve({ ok: false });
  const url = `${API_URL}?action=add&sheet=${encodeURIComponent(sheet)}&data=${encodeURIComponent(JSON.stringify(data))}&t=${Date.now()}`;
  return fetch(url).then(r => r.json()).catch(() => ({ ok: false }));
};

const apiDel = (sheet, id) => {
  if (!API_READY) return Promise.resolve({ ok: false });
  const url = `${API_URL}?action=delete&sheet=${encodeURIComponent(sheet)}&id=${encodeURIComponent(id)}&t=${Date.now()}`;
  return fetch(url).then(r => r.json()).catch(() => ({ ok: false }));
};

const apiUpdate = (sheet, id, data) => {
  if (!API_READY) return Promise.resolve({ ok: false });
  const url = `${API_URL}?action=update&sheet=${encodeURIComponent(sheet)}&id=${encodeURIComponent(id)}&data=${encodeURIComponent(JSON.stringify(data))}&t=${Date.now()}`;
  return fetch(url).then(r => r.json()).catch(() => ({ ok: false }));
};

const EXPENSE_CATS = ['Реклама', 'Закупка букетов', 'Зарплата', 'Прочее', 'Инструменты', 'Транспорт'];

// ─── MODAL ───────────────────────────────────────────────────────────────
function Modal({ title, onClose, children, footer }) {
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <span className="modal-title">{title}</span>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

// ─── REMINDERS ───────────────────────────────────────────────────────────
function Reminders({ orders, clients }) {
  const today = new Date();
  today.setHours(0,0,0,0);

  // Последний заказ на каждого клиента
  const lastOrder = {};
  orders.filter(o => o.status === 'выполнен' && o.date).forEach(o => {
    const key = o.clientId || o.clientName;
    if (!lastOrder[key] || o.date > lastOrder[key].date) lastOrder[key] = o;
  });

  // Ищем тех, у кого годовщина заказа в ближайшие 3 дня (или уже прошла до 1 дня назад)
  const reminders = [];
  Object.values(lastOrder).forEach(o => {
    const d = new Date(o.date);
    // Годовщина в этом году
    const ann = new Date(today.getFullYear(), d.getMonth(), d.getDate());
    let diff = Math.round((ann - today) / 86400000);
    // Если годовщина уже была в этом году, берём следующий год
    if (diff < -1) {
      const ann2 = new Date(today.getFullYear() + 1, d.getMonth(), d.getDate());
      diff = Math.round((ann2 - today) / 86400000);
    }
    if (diff >= -1 && diff <= 3) {
      const client = clients.find(c => c.id === o.clientId);
      reminders.push({ ...o, daysUntil: diff, clientLabel: client?.name || o.clientName });
    }
  });

  reminders.sort((a, b) => a.daysUntil - b.daysUntil);

  if (reminders.length === 0) return null;

  const dayLabel = (d) => {
    if (d === 0) return { text: 'Сегодня', color: 'var(--red)' };
    if (d === 1) return { text: 'Завтра', color: 'var(--gold)' };
    if (d === -1) return { text: 'Вчера', color: 'var(--text-dim)' };
    return { text: `Через ${d} дня`, color: 'var(--blue)' };
  };

  return (
    <div className="card" style={{marginBottom:24,border:'1px solid var(--gold-light)'}}>
      <div className="card-title">🔔 Напоминания — пора написать клиенту</div>
      {reminders.map(r => {
        const { text, color } = dayLabel(r.daysUntil);
        return (
          <div key={r.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid var(--border)',flexWrap:'wrap',gap:8}}>
            <div>
              <div style={{fontWeight:500,fontSize:13}}>{r.clientLabel}</div>
              <div style={{fontSize:11,color:'var(--text-dim)',marginTop:2}}>
                Последний заказ: {fmtDate(r.date)} · {r.city} · {fmt(r.sellPrice)} {r.currency}
              </div>
            </div>
            <span style={{color,fontWeight:600,fontSize:12,background:color+'22',padding:'4px 12px',borderRadius:20}}>{text}</span>
          </div>
        );
      })}
    </div>
  );
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────
function Dashboard({ orders, expenses, clients }) {
  const allMonths = useMemo(() => {
    const keys = new Set();
    [...orders, ...expenses].forEach(x => { if(x.date) keys.add(fmtDate(x.date).slice(0,7)); });
    return [...keys].sort().reverse();
  }, [orders, expenses]);

  const [filterMonth, setFilterMonth] = useState('');

  const filtOrders = filterMonth ? orders.filter(o => fmtDate(o.date).startsWith(filterMonth)) : orders;
  const filtExp    = filterMonth ? expenses.filter(e => fmtDate(e.date).startsWith(filterMonth)) : expenses;

  const revenue = filtOrders.filter(o=>o.status==='выполнен').reduce((s,o)=>s+o.sellPrice,0);
  const cogs    = filtOrders.filter(o=>o.status==='выполнен').reduce((s,o)=>s+o.buyPrice,0);
  const deliveryTotal = filtOrders.filter(o=>o.status==='выполнен').reduce((s,o)=>s+(o.deliveryCost||0),0);
  const expTotal = filtExp.reduce((s,e)=>s+e.amount,0);
  const profit  = revenue - cogs - deliveryTotal - expTotal;
  const margin  = revenue ? ((profit/revenue)*100).toFixed(1) : 0;

  const months = {};
  filtOrders.filter(o=>o.status==='выполнен').forEach(o => {
    const m = monthKey(o.date);
    if(!months[m]) months[m] = { rev: 0, cost: 0 };
    months[m].rev += o.sellPrice; months[m].cost += o.buyPrice;
  });
  filtExp.forEach(e => {
    const m = monthKey(e.date);
    if(!months[m]) months[m] = { rev: 0, cost: 0 };
    months[m].cost += e.amount;
  });
  const chartData = Object.entries(months).sort().slice(-6).map(([k,v])=>({ label: MONTHS[parseInt(k.split('-')[1])-1], rev: v.rev, cost: v.cost }));
  const maxVal = Math.max(...chartData.map(d=>d.rev), 1);
  const expByCat = {};
  filtExp.forEach(e => { expByCat[e.category] = (expByCat[e.category]||0)+e.amount; });
  const recentOrders = [...filtOrders].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

  const monthLabel = (m) => {
    if (!m) return '';
    const [y, mo] = m.split('-');
    return `${MONTHS[parseInt(mo)-1]} ${y}`;
  };

  return (
    <div>
      <Reminders orders={orders} clients={clients}/>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div style={{fontSize:12,color:'var(--text-dim)'}}>
          {filterMonth ? <span>Период: <b style={{color:'var(--text)'}}>{monthLabel(filterMonth)}</b></span> : <span>Все время</span>}
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <select value={filterMonth} onChange={e=>setFilterMonth(e.target.value)} style={{height:30,fontSize:12,padding:'0 8px',borderRadius:6,border:'1px solid var(--border)',background:'var(--bg3)',color:filterMonth?'var(--text)':'var(--text-dim)',cursor:'pointer',outline:'none'}}>
            <option value=''>Все месяцы</option>
            {allMonths.map(m=><option key={m} value={m}>{monthLabel(m)}</option>)}
          </select>
          {filterMonth && <button className="btn btn-ghost btn-sm" onClick={()=>setFilterMonth('')}>✕</button>}
        </div>
      </div>
      <div className="stats-grid">
        <div className="stat-card"><div className="stat-label">Выручка</div><div className="stat-value gold">{fmt(revenue)} $</div><div className="stat-sub">{filtOrders.filter(o=>o.status==='выполнен').length} выполненных заказов</div></div>
        <div className="stat-card"><div className="stat-label">Расходы</div><div className="stat-value red">{fmt(cogs+expTotal)} $</div><div className="stat-sub">Закупки + операционные</div></div>
        <div className="stat-card"><div className="stat-label">Прибыль</div><div className={`stat-value ${profit>=0?'green':'red'}`}>{fmt(profit)} $</div><div className="profit-bar"><div className="profit-fill" style={{width:Math.max(0,Math.min(100,margin))+'%'}}></div></div><div className="stat-sub">Маржа {margin}%</div></div>
        <div className="stat-card"><div className="stat-label">Клиентов</div><div className="stat-value gold">{clients.length}</div><div className="stat-sub">{clients.filter(c=>c.vip===true||c.vip==='true').length} VIP</div></div>
      </div>
      <div className="resp-grid" style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:16}}>
        <div className="card">
          <div className="card-title">Доходы vs Расходы (по месяцам)</div>
          {chartData.length === 0 ? <div className="empty"><div className="empty-icon">📊</div><p>Нет данных</p></div> :
          <div className="bar-chart">{chartData.map(d => (<div key={d.label} className="bar-col"><div className="bar-wrap" style={{gap:3}}><div className="bar" style={{background:'var(--green)', height:(d.rev/maxVal*100)+'%'}}></div><div className="bar" style={{background:'var(--red)', height:(d.cost/maxVal*100)+'%'}}></div></div><div className="bar-label">{d.label}</div></div>))}</div>}
          <div style={{display:'flex',gap:16,marginTop:12,fontSize:11,color:'var(--text-dim)'}}><span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:8,height:8,background:'var(--green)',borderRadius:2,display:'inline-block'}}></span>Доход</span><span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:8,height:8,background:'var(--red)',borderRadius:2,display:'inline-block'}}></span>Расходы</span></div>
        </div>
        <div className="card">
          <div className="card-title">Расходы по категориям</div>
          {Object.entries(expByCat).length === 0 ? <div className="empty"><div className="empty-icon">💰</div><p>Нет расходов</p></div> :
          Object.entries(expByCat).sort((a,b)=>b[1]-a[1]).map(([cat, amt])=>(<div key={cat} style={{marginBottom:12}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}><span>{cat}</span><span className="amount-neg">{fmt(amt)} $</span></div><div className="profit-bar"><div style={{height:'100%',borderRadius:3,background:'var(--gold)',width:(amt/expTotal*100)+'%',transition:'width 0.5s'}}></div></div></div>))}
        </div>
      </div>
      <div className="card">
        <div className="card-title">Последние заказы</div>
        {recentOrders.length === 0 ? <div className="empty"><div className="empty-icon">📦</div><p>Нет заказов</p></div> :
        <div className="table-wrap"><table><thead><tr><th>Дата</th><th>Клиент</th><th>Товар</th><th>Город</th><th>Продажа</th><th>Закупка</th><th>Прибыль</th><th>Статус</th></tr></thead><tbody>{recentOrders.map(o=>(<tr key={o.id}><td>{fmtDate(o.date)}</td><td>{o.clientName}</td><td style={{color:'var(--text-dim)'}}>{o.item}</td><td>{o.city}</td><td className="amount-pos">{fmt(o.sellPrice)} $</td><td className="amount-neg">{fmt(o.buyPrice)} $</td><td className={o.sellPrice-o.buyPrice>=0?'amount-pos':'amount-neg'}>{fmt(o.sellPrice-o.buyPrice)} $</td><td><StatusBadge status={o.status}/></td></tr>))}</tbody></table></div>}
      </div>
    </div>
  );
}

function StatusBadge({status}) {
  const map = { 'выполнен':'badge-green','в процессе':'badge-blue','отменён':'badge-red','новый':'badge-gold' };
  return <span className={`badge ${map[status]||'badge-gray'}`}>{status}</span>;
}

// ─── ORDERS ──────────────────────────────────────────────────────────────
function Orders({ orders, setOrders, clients }) {
  const [showModal, setShowModal] = useState(false);
  const [editId, setEditId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [filterCity, setFilterCity] = useState('');
  const [filterMonth, setFilterMonth] = useState('');
  const emptyForm = { clientId:'', clientName:'', city:'', item:'', supplier:'', sellPrice:'', buyPrice:'', deliveryCost:'', currency:'USD', status:'новый', manager:'', date:today(), notes:'' };
  const [form, setForm] = useState(emptyForm);
  const cities = [...new Set(orders.map(o=>o.city).filter(Boolean))];
  const allMonths = useMemo(() => {
    const keys = new Set(orders.map(o => fmtDate(o.date).slice(0,7)).filter(Boolean));
    return [...keys].sort().reverse();
  }, [orders]);
  const filtered = orders.filter(o =>
    (!search || (o.clientName||'').toLowerCase().includes(search.toLowerCase()) || (o.item||'').toLowerCase().includes(search.toLowerCase())) &&
    (!filterStatus || o.status === filterStatus) &&
    (!filterCity || o.city === filterCity) &&
    (!filterMonth || fmtDate(o.date).startsWith(filterMonth))
  ).sort((a,b)=>b.date.localeCompare(a.date));
  const monthLabel = (m) => { if(!m) return ''; const [y,mo]=m.split('-'); return `${MONTHS[parseInt(mo)-1]} ${y}`; };
  const openEdit = (o) => {
    setEditId(o.id);
    setForm({ clientId:o.clientId||'', clientName:o.clientName||'', city:o.city||'', item:o.item||'', supplier:o.supplier||'', sellPrice:o.sellPrice||'', buyPrice:o.buyPrice||'', deliveryCost:o.deliveryCost||'', currency:o.currency||'USD', status:o.status||'новый', manager:o.manager||'', date:o.date||today(), notes:o.notes||'' });
    setShowModal(true);
  };
  const closeModal = () => { setShowModal(false); setEditId(null); setForm(emptyForm); setSaving(false); };
  const save = () => {
    if(!form.item || !form.sellPrice) return;
    setSaving(true);
    const client = clients.find(c=>c.id===form.clientId);
    const base = { ...form, sellPrice: +form.sellPrice, buyPrice: +form.buyPrice, deliveryCost: +form.deliveryCost||0, clientName: client ? (client.name || client.phone) : form.clientName, city: client ? client.city : form.city };
    if (editId) {
      const updated = { ...base, id: editId };
      setOrders(prev => prev.map(o => o.id === editId ? updated : o));
      apiUpdate('orders', editId, updated).finally(closeModal);
    } else {
      const newItem = { ...base, id: uid() };
      setOrders(prev => [...prev, newItem]);
      apiAdd('orders', newItem).finally(closeModal);
    }
  };
  const del = (id) => { setOrders(prev => prev.filter(o => o.id !== id)); apiDel('orders', id); };
  return (
    <div>
      <div className="section-header"><h2>Заказы</h2><button className="btn btn-gold" onClick={()=>setShowModal(true)}>+ Новый заказ</button></div>
      <div className="filter-row" style={{marginBottom:16}}>
        <div className="search-bar"><span className="search-icon">🔍</span><input placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{width:'auto'}}><option value="">Все статусы</option>{['новый','в процессе','выполнен','отменён'].map(s=><option key={s}>{s}</option>)}</select>
        <select value={filterCity} onChange={e=>setFilterCity(e.target.value)} style={{width:'auto'}}><option value="">Все города</option>{cities.map(c=><option key={c}>{c}</option>)}</select>
        <select value={filterMonth} onChange={e=>setFilterMonth(e.target.value)} style={{width:'auto'}}><option value="">Все месяцы</option>{allMonths.map(m=><option key={m} value={m}>{monthLabel(m)}</option>)}</select>
        {filterMonth && <button className="btn btn-ghost btn-sm" onClick={()=>setFilterMonth('')}>✕</button>}
      </div>
      <div className="card">
        {filtered.length === 0 ? <div className="empty"><div className="empty-icon">📦</div><p>Заказов не найдено</p></div> :
        <div className="table-wrap"><table><thead><tr><th>Дата</th><th>Клиент</th><th className="hide-mob">Товар</th><th className="hide-mob">Поставщик</th><th className="hide-mob">Город</th><th>Продажа</th><th className="hide-mob">Закупка</th><th className="hide-mob">Доставка</th><th className="hide-mob">Маржа</th><th className="hide-mob">Менеджер</th><th>Статус</th><th></th></tr></thead><tbody>{filtered.map(o=>(<tr key={o.id}><td>{fmtDate(o.date)}</td><td>{o.clientName}</td><td className="hide-mob" style={{color:'var(--text-dim)'}}>{o.item}</td><td className="hide-mob" style={{color:'var(--text-dim)'}}>{o.supplier}</td><td className="hide-mob">{o.city}</td><td className="amount-pos">{fmt(o.sellPrice)} $</td><td className="hide-mob amount-neg">{fmt(o.buyPrice)} $</td><td className="hide-mob" style={{color:'var(--text-dim)'}}>{o.deliveryCost>0?fmt(o.deliveryCost)+' $':'—'}</td><td className={`hide-mob ${o.sellPrice-o.buyPrice-(o.deliveryCost||0)>=0?'amount-pos':'amount-neg'}`}>{fmt(o.sellPrice-o.buyPrice-(o.deliveryCost||0))} $</td><td className="hide-mob">{o.manager}</td><td><StatusBadge status={o.status}/></td><td style={{display:'flex',gap:4}}><button className="btn btn-ghost btn-sm" onClick={()=>openEdit(o)}>✏️</button><button className="btn btn-ghost btn-sm" onClick={()=>del(o.id)}>✕</button></td></tr>))}</tbody></table></div>}
      </div>
      {showModal && (
        <Modal title={editId ? 'Редактировать заказ' : 'Новый заказ'} onClose={closeModal} footer={<><button className="btn btn-ghost" onClick={closeModal} disabled={saving}>Отмена</button><button className="btn btn-gold" onClick={save} disabled={saving}>{saving ? 'Сохранение...' : 'Сохранить'}</button></>}>
          <div className="form-grid">
            <div className="form-group"><label>Клиент</label><ClientSearch clients={clients} value={form.clientId} onChange={c => setForm(f=>({...f, clientId:c.id, clientName:c.name||c.phone, city:c.city||f.city}))}/></div>
            <div className="form-group"><label>Дата</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
            <div className="form-group full"><label>Состав / Название букета</label><input placeholder="Розы 51шт, красные" value={form.item} onChange={e=>setForm(f=>({...f,item:e.target.value}))}/></div>
            <div className="form-group"><label>Поставщик</label><input placeholder="FloraAntalya" value={form.supplier} onChange={e=>setForm(f=>({...f,supplier:e.target.value}))}/></div>
            <div className="form-group"><label>Город</label><input placeholder="Анталья" value={form.city} onChange={e=>setForm(f=>({...f,city:e.target.value}))}/></div>
            <div className="form-group"><label>Цена продажи</label><input type="number" placeholder="5000" value={form.sellPrice} onChange={e=>setForm(f=>({...f,sellPrice:e.target.value}))}/></div>
            <div className="form-group"><label>Цена закупки</label><input type="number" placeholder="2500" value={form.buyPrice} onChange={e=>setForm(f=>({...f,buyPrice:e.target.value}))}/></div>
            <div className="form-group"><label>Стоимость доставки</label><input type="number" placeholder="0" value={form.deliveryCost} onChange={e=>setForm(f=>({...f,deliveryCost:e.target.value}))}/></div>
            <div className="form-group"><label>Валюта</label><select value={form.currency} onChange={e=>setForm(f=>({...f,currency:e.target.value}))}>{['USD','EUR','TRY','AED','THB'].map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="form-group"><label>Статус</label><select value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))}>{['новый','в процессе','выполнен','отменён'].map(s=><option key={s}>{s}</option>)}</select></div>
            <div className="form-group"><label>Менеджер</label><input placeholder="Юсуф" value={form.manager} onChange={e=>setForm(f=>({...f,manager:e.target.value}))}/></div>
            <div className="form-group full"><label>Заметка</label><textarea placeholder="Особые пожелания клиента..." value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/></div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── CLIENTS ──────────────────────────────────────────────────────────────
function Clients({ clients, setClients, orders }) {
  const emptyForm = { name:'', phone:'', lang:'RU', source:'Instagram', vip:false, birthday:'', tags:'', notes:'', city:'' };
  const [showModal, setShowModal] = useState(false);
  const [editId, setEditId] = useState(null);
  const [selected, setSelected] = useState(null);
  const [search, setSearch] = useState('');
  const [form, setForm] = useState(emptyForm);
  const [saving, setSaving] = useState(false);

  const filtered = clients.filter(c => !search || (c.name||'').toLowerCase().includes(search.toLowerCase()) || (c.phone||'').includes(search));

  const openNew = () => { setEditId(null); setForm(emptyForm); setShowModal(true); };
  const openEdit = (c, e) => {
    e.stopPropagation();
    setEditId(c.id);
    setForm({ name:c.name||'', phone:c.phone||'', lang:c.lang||'RU', source:c.source||'Instagram', vip:c.vip===true||c.vip==='true', birthday:c.birthday||'', tags:c.tags||'', notes:c.notes||'', city:c.city||'' });
    setShowModal(true);
  };
  const closeModal = () => { setShowModal(false); setEditId(null); setForm(emptyForm); setSaving(false); };

  const save = () => {
    if(!form.phone && !form.name) return;
    setSaving(true);
    if (editId) {
      const updated = { ...clients.find(c=>c.id===editId), ...form };
      setClients(prev => prev.map(c => c.id===editId ? updated : c));
      apiUpdate('clients', editId, updated).finally(closeModal);
    } else {
      const newClient = { ...form, id: uid(), created: today() };
      setClients(prev => [...prev, newClient]);
      apiAdd('clients', newClient).finally(closeModal);
    }
  };

  const clientOrders = selected ? orders.filter(o=>o.clientId===selected.id) : [];
  const totalSpent = clientOrders.filter(o=>o.status==='выполнен').reduce((s,o)=>s+o.sellPrice,0);
  const SOURCES = ['Instagram','WhatsApp','Сайт','Рекомендация','TikTok','Google','Прочее'];
  const LANGS = ['RU','EN','TR','AR','TH'];

  const ClientForm = () => (
    <div className="form-grid">
      <div className="form-group full"><label>Имя</label><input placeholder="Анна Петрова" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
      <div className="form-group"><label>Телефон / WhatsApp</label><input placeholder="+7 926 ..." value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))}/></div>
      <div className="form-group"><label>Город</label><input placeholder="Анталья" value={form.city} onChange={e=>setForm(f=>({...f,city:e.target.value}))}/></div>
      <div className="form-group"><label>Источник</label><select value={form.source} onChange={e=>setForm(f=>({...f,source:e.target.value}))}>{SOURCES.map(s=><option key={s}>{s}</option>)}</select></div>
      <div className="form-group"><label>Язык</label><select value={form.lang} onChange={e=>setForm(f=>({...f,lang:e.target.value}))}>{LANGS.map(l=><option key={l}>{l}</option>)}</select></div>
      <div className="form-group"><label>День рождения</label><input type="date" value={form.birthday} onChange={e=>setForm(f=>({...f,birthday:e.target.value}))}/></div>
      <div className="form-group"><label>Теги</label><input placeholder="свадьба, постоянная" value={form.tags} onChange={e=>setForm(f=>({...f,tags:e.target.value}))}/></div>
      <div className="form-group full" style={{flexDirection:'row',alignItems:'center',gap:10}}><input type="checkbox" id="vip-cb" checked={form.vip} onChange={e=>setForm(f=>({...f,vip:e.target.checked}))} style={{width:'auto'}}/><label htmlFor="vip-cb" style={{textTransform:'none',letterSpacing:0,fontSize:13,cursor:'pointer'}}>★ VIP клиент</label></div>
      <div className="form-group full"><label>Заметки</label><textarea placeholder="Предпочтения, особые пожелания..." value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/></div>
    </div>
  );

  return (
    <div>
      <div className="section-header"><h2>Клиенты</h2><button className="btn btn-gold" onClick={openNew}>+ Добавить клиента</button></div>
      <div className="filter-row" style={{marginBottom:16}}><div className="search-bar"><span className="search-icon">🔍</span><input placeholder="Имя или телефон..." value={search} onChange={e=>setSearch(e.target.value)}/></div></div>
      <div className="card">
        {filtered.length === 0 ? <div className="empty"><div className="empty-icon">👥</div><p>Клиентов не найдено</p></div> :
        <div className="table-wrap"><table><thead><tr><th>Имя</th><th>Телефон</th><th>Город</th><th>Источник</th><th>Язык</th><th>Заказов</th><th>Метки</th><th></th></tr></thead><tbody>{filtered.map(c=>{ const cnt = orders.filter(o=>o.clientId===c.id).length; return (
          <tr key={c.id} className="clickable-row" onClick={()=>setSelected(c)}>
            <td><span style={{display:'flex',alignItems:'center',gap:8}}>{(c.vip===true||c.vip==='true') && <span className="tag-pill vip">VIP</span>}{c.name||<span style={{color:'var(--text-dim)'}}>—</span>}</span></td>
            <td style={{color:'var(--text-dim)'}}>{c.phone}</td>
            <td>{c.city}</td>
            <td><span className="badge badge-blue">{c.source}</span></td>
            <td><span className="badge badge-gray">{c.lang}</span></td>
            <td>{cnt}</td>
            <td>{c.tags && c.tags.split(',').map(t=><span key={t} className="tag-pill" style={{marginRight:4}}>{t.trim()}</span>)}</td>
            <td><button className="btn btn-ghost btn-sm" onClick={e=>openEdit(c,e)}>✏️</button></td>
          </tr>
        ); })}</tbody></table></div>}
      </div>

      {selected && (
        <Modal title={selected.name||selected.phone} onClose={()=>setSelected(null)} footer={
          <><button className="btn btn-ghost" onClick={()=>{ setClients(p=>p.filter(c=>c.id!==selected.id)); apiDel('clients', selected.id); setSelected(null); }}>Удалить</button>
          <button className="btn btn-ghost" onClick={e=>{ openEdit(selected,e); setSelected(null); }}>Редактировать</button>
          <button className="btn btn-gold" onClick={()=>setSelected(null)}>Закрыть</button></>
        }>
          <div className="detail-grid" style={{marginBottom:16}}>
            <div className="detail-item"><label>Телефон</label><div className="val">{selected.phone||'—'}</div></div>
            <div className="detail-item"><label>Город</label><div className="val">{selected.city||'—'}</div></div>
            <div className="detail-item"><label>Источник</label><div className="val">{selected.source||'—'}</div></div>
            <div className="detail-item"><label>Язык</label><div className="val">{selected.lang||'—'}</div></div>
            <div className="detail-item"><label>День рождения</label><div className="val">{selected.birthday||'—'}</div></div>
            <div className="detail-item"><label>Теги</label><div className="val">{selected.tags||'—'}</div></div>
            {selected.notes && <div className="detail-item" style={{gridColumn:'1/-1'}}><label>Заметки</label><div className="val">{selected.notes}</div></div>}
          </div>
          <div style={{display:'flex',gap:12,marginBottom:16}}>
            <div className="stat-card" style={{flex:1,padding:12}}><div className="stat-label">Заказов</div><div className="stat-value gold" style={{fontSize:20}}>{clientOrders.length}</div></div>
            <div className="stat-card" style={{flex:1,padding:12}}><div className="stat-label">Потрачено</div><div className="stat-value green" style={{fontSize:20}}>{fmt(totalSpent)} $</div></div>
          </div>
          {clientOrders.length > 0 && <div><div style={{fontSize:11,color:'var(--text-dim)',marginBottom:8,textTransform:'uppercase',letterSpacing:1}}>История заказов</div><div className="scrollable">{clientOrders.sort((a,b)=>b.date.localeCompare(a.date)).map(o=>(<div key={o.id} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)',fontSize:13}}><span style={{color:'var(--text-dim)'}}>{fmtDate(o.date)}</span><span>{o.item}</span><span className="amount-pos">{fmt(o.sellPrice)} $</span><StatusBadge status={o.status}/></div>))}</div></div>}
        </Modal>
      )}

      {showModal && (
        <Modal title={editId ? 'Редактировать клиента' : 'Новый клиент'} onClose={closeModal} footer={<><button className="btn btn-ghost" onClick={closeModal} disabled={saving}>Отмена</button><button className="btn btn-gold" onClick={save} disabled={saving}>{saving ? 'Сохранение...' : 'Сохранить'}</button></>}>
          <ClientForm/>
        </Modal>
      )}
    </div>
  );
}

// ─── EXPENSES ─────────────────────────────────────────────────────────────
function Expenses({ expenses, setExpenses }) {
  const [showModal, setShowModal] = useState(false);
  const [search, setSearch] = useState('');
  const [filterCat, setFilterCat] = useState('');
  const [form, setForm] = useState({ category:'Реклама', amount:'', currency:'USD', date:today(), note:'', city:'' });
  const filtered = expenses.filter(e=>(!search || e.note.toLowerCase().includes(search.toLowerCase())) && (!filterCat || e.category===filterCat)).sort((a,b)=>b.date.localeCompare(a.date));
  const total = filtered.reduce((s,e)=>s+e.amount,0);
  const save = () => {
    if(!form.amount) return;
    const newExpense = {...form, id: uid(), amount: +form.amount};
    setExpenses(prev => [...prev, newExpense]);
    apiAdd('expenses', newExpense);
    setShowModal(false);
    setForm({category:'Реклама', amount:'', currency:'USD', date:today(), note:'', city:''});
  };
  return (
    <div>
      <div className="section-header"><h2>Расходы</h2><button className="btn btn-gold" onClick={()=>setShowModal(true)}>+ Добавить расход</button></div>
      <div className="filter-row" style={{marginBottom:16}}>
        <div className="search-bar"><span className="search-icon">🔍</span><input placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
        <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={{width:'auto'}}><option value="">Все категории</option>{EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}</select>

// ─── P&L ─────────────────────────────────────────────────────────────────
function PnL({ orders, expenses }) {
  const [period, setPeriod] = useState('all');
  const [specificMonth, setSpecificMonth] = useState('');
  const allMonths = useMemo(() => { const keys = new Set(); [...orders, ...expenses].forEach(x => { if(x.date) keys.add(x.date.slice(0,7)); }); return [...keys].sort().reverse(); }, [orders, expenses]);
  const filterByPeriod = (items, dateField) => {
    const now = new Date();
    return items.filter(item => {
      if(period==='specific') return item[dateField] && item[dateField].startsWith(specificMonth);
      if(period==='all') return true;
      const d = new Date(item[dateField]);
      if(period==='month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
      if(period==='quarter') { const q = Math.floor(now.getMonth()/3); return Math.floor(d.getMonth()/3)===q && d.getFullYear()===now.getFullYear(); }
      return d.getFullYear()===now.getFullYear();
    });
  };
  const filtOrders = filterByPeriod(orders.filter(o=>o.status==='выполнен'),'date');
  const filtExp = filterByPeriod(expenses,'date');
  const revenue = filtOrders.reduce((s,o)=>s+o.sellPrice,0);
  const cogs = filtOrders.reduce((s,o)=>s+o.buyPrice,0);
  const deliveryTotal = filtOrders.reduce((s,o)=>s+(o.deliveryCost||0),0);
  const grossProfit = revenue - cogs - deliveryTotal;
  const opEx = filtExp.reduce((s,e)=>s+e.amount,0);
  const netProfit = grossProfit - opEx;
  const margin = revenue ? ((netProfit/revenue)*100).toFixed(1) : 0;
  const byCity = {}; filtOrders.forEach(o=>{ if(!byCity[o.city]) byCity[o.city]={rev:0,cost:0}; byCity[o.city].rev+=o.sellPrice; byCity[o.city].cost+=o.buyPrice; });
  const byMgr = {}; filtOrders.forEach(o=>{ if(!byMgr[o.manager||'—']) byMgr[o.manager||'—']=0; byMgr[o.manager||'—']+=o.sellPrice; });
  const Row = ({label, value, sub, bold, color}) => (<div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--border)',fontWeight:bold?'600':'400'}}><span style={{color:sub?'var(--text-dim)':undefined,paddingLeft:sub?16:0}}>{label}</span><span style={{color:color||undefined}}>{fmt(value)} $</span></div>);
  return (
    <div>
      <div className="section-header">
        <h2>Отчёт P&L</h2>
        <div style={{display:'flex',gap:8}}>
          {[['all','Всё время'],['month','Тек. месяц'],['quarter','Квартал'],['year','Год']].map(([v,l])=>(<button key={v} className={`btn ${period===v?'btn-gold':'btn-ghost'} btn-sm`} onClick={()=>{ setPeriod(v); setSpecificMonth(''); }}>{l}</button>))}
          <select value={period==='specific'?specificMonth:''} onChange={e=>{ if(e.target.value){ setSpecificMonth(e.target.value); setPeriod('specific'); } }} style={{height:32,fontSize:12,padding:'0 8px',borderRadius:8,border:'1px solid '+(period==='specific'?'var(--gold)':'var(--border)'),background:'var(--bg3)',color:period==='specific'?'var(--gold)':'var(--text-dim)',cursor:'pointer',outline:'none'}}>
            <option value="">Месяц...</option>
            {allMonths.map(m=>{ const [y,mo]=m.split('-'); return <option key={m} value={m}>{['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'][parseInt(mo)-1]} {y}</option>; })}
          </select>
        </div>
      </div>
      <div className="resp-grid" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div className="card">
          <div className="card-title">Отчёт о прибылях и убытках</div>
          <Row label="Выручка" value={revenue} bold color="var(--green)"/>
          <Row label="Закупка букетов" value={cogs} sub color="var(--red)"/>
          {deliveryTotal>0 && <Row label="Доставка" value={deliveryTotal} sub color="var(--red)"/>}
          <Row label="Валовая прибыль" value={grossProfit} bold color={grossProfit>=0?'var(--green)':'var(--red)'}/>
          <div style={{height:8}}/>
          <div style={{fontSize:11,color:'var(--text-dim)',textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Операционные расходы</div>
          {EXPENSE_CATS.map(cat=>{ const amt=filtExp.filter(e=>e.category===cat).reduce((s,e)=>s+e.amount,0); return amt>0?<Row key={cat} label={cat} value={amt} sub color="var(--red)"/>:null; })}
          <Row label="Итого расходы" value={opEx} bold color="var(--red)"/>
          <div style={{height:8}}/>
          <Row label="Чистая прибыль" value={netProfit} bold color={netProfit>=0?'var(--green)':'var(--red)'}/>
          <div style={{marginTop:12,padding:'12px',background:'var(--bg3)',borderRadius:8,textAlign:'center'}}><div style={{fontSize:11,color:'var(--text-dim)',marginBottom:4}}>Маржинальность</div><div style={{fontSize:32,color:netProfit>=0?'var(--green)':'var(--red)'}}>{margin}%</div></div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div className="card"><div className="card-title">По городам</div>{Object.entries(byCity).length===0?<div style={{color:'var(--text-dim)',fontSize:12}}>Нет данных</div>:Object.entries(byCity).sort((a,b)=>b[1].rev-a[1].rev).map(([city,d])=>(<div key={city} style={{marginBottom:12}}><div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}}><span>{city}</span><span className="amount-pos">{fmt(d.rev)} $</span></div><div className="profit-bar"><div className="profit-fill" style={{width:revenue?(d.rev/revenue*100)+'%':'0%'}}></div></div></div>))}</div>
          <div className="card"><div className="card-title">По менеджерам</div>{Object.entries(byMgr).length===0?<div style={{color:'var(--text-dim)',fontSize:12}}>Нет данных</div>:Object.entries(byMgr).sort((a,b)=>b[1]-a[1]).map(([mgr,rev])=>(<div key={mgr} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)22',fontSize:13}}><span>{mgr}</span><span className="amount-pos">{fmt(rev)} $</span></div>))}</div>
          <div className="card"><div className="card-title">Ключевые показатели</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>{[['Заказов',filtOrders.length,''],['Средний чек',filtOrders.length?Math.round(revenue/filtOrders.length):0,' $'],['Ср. маржа/заказ',filtOrders.length?Math.round(grossProfit/filtOrders.length):0,' $'],['ROI рекламы',filtExp.filter(e=>e.category==='Реклама').reduce((s,e)=>s+e.amount,0)?Math.round(revenue/filtExp.filter(e=>e.category==='Реклама').reduce((s,e)=>s+e.amount,0)*100):0,'%']].map(([l,v,suf])=>(<div key={l} style={{background:'var(--bg3)',borderRadius:8,padding:12}}><div style={{fontSize:10,color:'var(--text-dim)',textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>{l}</div><div style={{fontSize:22,color:'var(--gold)'}}>{fmt(v)}{suf}</div></div>))}</div></div>
        </div>
      </div>
    </div>
  );
}

// ─── CLIENT SEARCH INPUT ─────────────────────────────────────────────────
function ClientSearch({ clients, value, onChange }) {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const ref = React.useRef(null);

  // Закрываем при клике снаружи
  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const selected = clients.find(c => c.id === value);
  const displayQuery = open ? query : (selected ? (selected.name || selected.phone) : '');

  const filtered = query.trim()
    ? clients.filter(c =>
        (c.name || '').toLowerCase().includes(query.toLowerCase()) ||
        (c.phone || '').includes(query) ||
        (c.city || '').toLowerCase().includes(query.toLowerCase())
      ).slice(0, 30)
    : clients.slice(0, 30);

  const select = (c) => {
    onChange(c);
    setQuery('');
    setOpen(false);
  };

  return (
    <div className="client-search-wrap" ref={ref}>
      <input
        placeholder="Поиск по имени, телефону, городу..."
        value={displayQuery}
        onChange={e => { setQuery(e.target.value); setOpen(true); }}
        onFocus={() => { setQuery(''); setOpen(true); }}
        autoComplete="off"
      />
      {open && filtered.length > 0 && (
        <div className="client-dropdown">
          {filtered.map(c => (
            <div key={c.id} className="client-option" onMouseDown={() => select(c)}>
              <div>{c.name || <span style={{color:'var(--text-dim)'}}>Без имени</span>}</div>
              <div className="opt-phone">{c.phone}{c.city ? ` · ${c.city}` : ''}</div>
            </div>
          ))}
        </div>
      )}
      {open && filtered.length === 0 && query && (
        <div className="client-dropdown">
          <div className="client-option" style={{color:'var(--text-dim)'}}>Клиент не найден</div>
        </div>
      )}
    </div>
  );
}

// ─── SALARY CALC ─────────────────────────────────────────────────────────
// Правила: 5% стандарт; 7% если в день 3+ заказов И сумма дня >= 1000$
const calcSalary = (orders) => {
  const done = orders.filter(o => o.status === 'выполнен');
  // группируем выполненные заказы по дате
  const byDay = {};
  done.forEach(o => {
    const day = fmtDate(o.date);
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(o);
  });
  // определяем ставку для каждого заказа
  const rates = {};
  Object.values(byDay).forEach(dayOrders => {
    const total = dayOrders.reduce((s, o) => s + o.sellPrice, 0);
    const rate = (total >= 1000 && dayOrders.length >= 3) ? 0.07 : 0.05;
    dayOrders.forEach(o => { rates[o.id] = rate; });
  });
  return rates;
};

function Managers({ orders }) {
  const [period, setPeriod] = useState('all');
  const [specificMonth, setSpecificMonth] = useState('');

  const allMonths = useMemo(() => {
    const keys = new Set();
    orders.forEach(x => { if(x.date) keys.add(fmtDate(x.date).slice(0,7)); });
    return [...keys].sort().reverse();
  }, [orders]);

  const filtered = orders.filter(o => {
    if (o.status !== 'выполнен') return false;
    const d = fmtDate(o.date);
    if (period === 'specific') return d.startsWith(specificMonth);
    if (period === 'all') return true;
    const now = new Date();
    const od = new Date(d);
    if (period === 'month') return od.getMonth()===now.getMonth() && od.getFullYear()===now.getFullYear();
    if (period === 'quarter') { const q=Math.floor(now.getMonth()/3); return Math.floor(od.getMonth()/3)===q && od.getFullYear()===now.getFullYear(); }
    return od.getFullYear()===now.getFullYear();
  });

  const rates = calcSalary(filtered);

  // группируем по менеджерам
  const byMgr = {};
  filtered.forEach(o => {
    const m = o.manager || '—';
    if (!byMgr[m]) byMgr[m] = { orders: [], salary5: 0, salary7: 0 };
    byMgr[m].orders.push(o);
    const rate = rates[o.id] || 0.05;
    if (rate === 0.07) byMgr[m].salary7 += o.sellPrice * 0.07;
    else byMgr[m].salary5 += o.sellPrice * 0.05;
  });

  // детализация по дням для выбранного менеджера
  const [selectedMgr, setSelectedMgr] = useState(null);
  const mgrOrders = selectedMgr ? filtered.filter(o => (o.manager||'—') === selectedMgr) : [];
  const byDay = {};
  mgrOrders.forEach(o => {
    const d = fmtDate(o.date);
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(o);
  });

  const totalSalary = Object.values(byMgr).reduce((s, m) => s + m.salary5 + m.salary7, 0);

  return (
    <div>
      <div className="section-header">
        <h2>Зарплата менеджеров</h2>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {[['all','Всё время'],['month','Тек. месяц'],['quarter','Квартал'],['year','Год']].map(([v,l])=>(
            <button key={v} className={`btn ${period===v?'btn-gold':'btn-ghost'} btn-sm`} onClick={()=>{ setPeriod(v); setSpecificMonth(''); }}>{l}</button>
          ))}
          <select value={period==='specific'?specificMonth:''} onChange={e=>{ if(e.target.value){ setSpecificMonth(e.target.value); setPeriod('specific'); } }} style={{height:32,fontSize:12,padding:'0 8px',borderRadius:8,border:'1px solid '+(period==='specific'?'var(--gold)':'var(--border)'),background:'var(--bg3)',color:period==='specific'?'var(--gold)':'var(--text-dim)',cursor:'pointer',outline:'none'}}>
            <option value="">Месяц...</option>
            {allMonths.map(m=>{ const [y,mo]=m.split('-'); return <option key={m} value={m}>{['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'][parseInt(mo)-1]} {y}</option>; })}
          </select>
        </div>
      </div>

      {/* Правила */}
      <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 16px',marginBottom:20,fontSize:12,color:'var(--text-dim)',display:'flex',gap:20,flexWrap:'wrap'}}>
        <span>⚡ <b style={{color:'var(--gold)'}}>7%</b> — день с 3+ заказами на $1000+</span>
        <span>📌 <b style={{color:'var(--text-dim)'}}>5%</b> — все остальные заказы</span>
      </div>

      {/* Итого */}
      <div className="stats-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:20}}>
        <div className="stat-card"><div className="stat-label">К выплате</div><div className="stat-value gold">{fmt(totalSalary)} $</div></div>
        <div className="stat-card"><div className="stat-label">Менеджеров</div><div className="stat-value gold">{Object.keys(byMgr).length}</div></div>
        <div className="stat-card"><div className="stat-label">Заказов</div><div className="stat-value gold">{filtered.length}</div></div>
      </div>

      {/* Таблица по менеджерам */}
      <div className="card" style={{marginBottom:16}}>
        {Object.keys(byMgr).length === 0 ? <div className="empty"><div className="empty-icon">💼</div><p>Нет выполненных заказов</p></div> :
        <div className="table-wrap"><table>
          <thead><tr><th>Менеджер</th><th>Заказов</th><th>Выручка</th><th>По 5%</th><th>По 7%</th><th>Итого ЗП</th><th></th></tr></thead>
          <tbody>{Object.entries(byMgr).sort((a,b)=>(b[1].salary5+b[1].salary7)-(a[1].salary5+a[1].salary7)).map(([mgr,d])=>(
            <tr key={mgr}>
              <td style={{fontWeight:500}}>{mgr}</td>
              <td>{d.orders.length}</td>
              <td className="amount-pos">{fmt(d.orders.reduce((s,o)=>s+o.sellPrice,0))} $</td>
              <td style={{color:'var(--text-dim)',fontSize:12}}>{fmt(d.salary5)} $</td>
              <td style={{color:'var(--gold)',fontSize:12}}>{fmt(d.salary7)} $</td>
              <td style={{fontWeight:600,color:'var(--green)'}}>{fmt(d.salary5+d.salary7)} $</td>
              <td><button className="btn btn-ghost btn-sm" onClick={()=>setSelectedMgr(selectedMgr===mgr?null:mgr)}>детали</button></td>
            </tr>
          ))}</tbody>
        </table></div>}
      </div>

      {/* Детализация по дням */}
      {selectedMgr && (
        <div className="card">
          <div className="card-title">Детализация — {selectedMgr}</div>
          <div className="table-wrap"><table>
            <thead><tr><th>Дата</th><th>Заказов в день</th><th>Сумма дня</th><th>Ставка</th><th>Заказ</th><th>Продажа</th><th>ЗП с заказа</th></tr></thead>
            <tbody>{Object.entries(byDay).sort((a,b)=>b[0].localeCompare(a[0])).flatMap(([day, dayOrders])=>{
              const dayTotal = dayOrders.reduce((s,o)=>s+o.sellPrice,0);
              const dayAll = filtered.filter(o=>fmtDate(o.date)===day);
              const rate = (dayAll.reduce((s,o)=>s+o.sellPrice,0) >= 1000 && dayAll.length >= 3) ? 0.07 : 0.05;
              return dayOrders.map((o,i)=>(
                <tr key={o.id}>
                  {i===0 && <td rowSpan={dayOrders.length} style={{verticalAlign:'top',paddingTop:14}}>{day}</td>}
                  {i===0 && <td rowSpan={dayOrders.length} style={{verticalAlign:'top',paddingTop:14}}>{dayAll.length}</td>}
                  {i===0 && <td rowSpan={dayOrders.length} style={{verticalAlign:'top',paddingTop:14}}>{fmt(dayAll.reduce((s,o)=>s+o.sellPrice,0))} $</td>}
                  {i===0 && <td rowSpan={dayOrders.length} style={{verticalAlign:'top',paddingTop:14}}><span className={`badge ${rate===0.07?'badge-gold':'badge-gray'}`}>{(rate*100).toFixed(0)}%</span></td>}
                  <td style={{color:'var(--text-dim)',fontSize:12}}>{o.item}</td>
                  <td className="amount-pos">{fmt(o.sellPrice)} $</td>
                  <td style={{color:'var(--green)',fontWeight:500}}>{fmt(o.sellPrice*rate)} $</td>
                </tr>
              ));
            })}</tbody>
          </table></div>
        </div>
      )}
    </div>
  );
}

      <div className={`sidebar-overlay ${sidebarOpen?'open':''}`} onClick={()=>setSidebarOpen(false)}></div>
      <div className={`sidebar ${sidebarOpen?'open':''}`}>
        <div className="sidebar-logo"><h1>YUCCA</h1><span>Flower CRM</span></div>
        <div className="sidebar-nav">
          <div className="nav-section">Навигация</div>
          {nav.map(n=>(<div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>{ setPage(n.id); setSidebarOpen(false); }}><span className="nav-icon">{n.icon}</span>{n.label}</div>))}
        </div>
        <div className="sidebar-footer">
          {API_READY
            ? <span><span className={`sync-dot ${synced?'':'syncing'}`}></span>{synced?'Google Sheets':'Синхронизация...'}</span>
            : <span style={{color:'var(--red)'}}>⚠ API не настроен</span>}
        </div>
      </div>
      <div className="main">
        <div className="topbar">
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <button className="hamburger" onClick={()=>setSidebarOpen(o=>!o)}>☰</button>
            <div className="topbar-title">{pageTitle}</div>
          </div>
          <div className="topbar-actions">
            <span style={{fontSize:12,color:'var(--text-dim)'}}>🌸 {clients.length} · {orders.length}</span>
            <button onClick={()=>setLight(l=>!l)} className="btn btn-ghost btn-sm" style={{fontSize:16,padding:'5px 10px'}}>{light?'🌙':'☀️'}</button>
          </div>
        </div>
        <div className="content">
          {!API_READY && <div style={{background:'#b8975a22',border:'1px solid var(--gold)',borderRadius:10,padding:'14px 20px',marginBottom:24,fontSize:13,color:'var(--gold)'}}>⚠️ Google Sheets не подключён. Вставь URL из Apps Script в переменную <code>API_URL</code> в файле CRM.</div>}
          {page==='dashboard' && <Dashboard orders={orders} expenses={expenses} clients={clients}/>}
          {page==='orders' && <Orders orders={orders} setOrders={setOrders} clients={clients}/>}
          {page==='clients' && <Clients clients={clients} setClients={setClients} orders={orders}/>}
          {page==='expenses' && <Expenses expenses={expenses} setExpenses={setExpenses}/>}
          {page==='pnl' && <PnL orders={orders} expenses={expenses}/>}
          {page==='managers' && <Managers orders={orders}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
